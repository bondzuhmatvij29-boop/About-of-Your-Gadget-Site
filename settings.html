<!DOCTYPE html>
<html lang="en" data-style="aero" data-page="html5">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings — AoyG</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<script>(function(){var t='black';try{t=localStorage.getItem('aog-theme')||'black';}catch(e){}if(t==='system'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'black':'white';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bar">
  <div class="wrap bar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/icon.png" alt="" width="40" height="40">
      AoyG
    </a>
    <a class="back-link" href="index.html" data-i18n="back">Back</a>
  </div>
</header>

<main class="wrap settings-page">
  <h1 data-i18n="settings">Settings</h1>
  <div class="card-box">
    <div class="label" data-i18n="styleTitle">Design style</div>
    <div class="opts">
      <button class="opt" data-style-value="aero" aria-pressed="true"><span data-i18n="styleAero">Aero</span><small data-i18n="styleAeroD">Glass panels on a sky gradient (default)</small></button>
      <button class="opt" data-style-value="m3" aria-pressed="false"><span data-i18n="styleM3">Material 3</span><small data-i18n="styleM3D">Google's current design language</small></button>
      <button class="opt" data-style-value="holo" aria-pressed="false"><span data-i18n="styleHolo">Holo Black</span><small data-i18n="styleHoloD">Flat black with blue accents</small></button>
    </div>

    <div class="label" data-i18n="themeTitle">Theme</div>
    <div class="opts">
      <button class="opt" data-theme-value="black" aria-pressed="true"><span data-i18n="themeBlack">Black</span><small data-i18n="themeBlackD">Default dark theme</small></button>
      <button class="opt" data-theme-value="white" aria-pressed="false"><span data-i18n="themeWhite">White</span><small data-i18n="themeWhiteD">Light background</small></button>
      <button class="opt" data-theme-value="system" aria-pressed="false"><span data-i18n="themeSystem">System</span><small data-i18n="themeSystemD">Follows your phone's dark mode setting</small></button>
    </div>

    <div class="label" data-i18n="htmlTitle">HTML version</div>
    <div class="opts">
      <a class="opt" href="index-html32.html"><span data-i18n="html32">HTML 3.2</span><small data-i18n="html32D">Plain page, no CSS effects</small></a>
      <a class="opt" href="index-html4.html"><span data-i18n="html4">HTML 4</span><small data-i18n="html4D">Basic styling, no modern effects</small></a>
      <a class="opt" href="index.html" aria-pressed="true"><span data-i18n="html5">HTML 5</span><small data-i18n="html5D">Full modern design (default)</small></a>
    </div>

    <div class="label" data-i18n="langTitle">Language</div>
    <select class="lang" id="langSel" aria-label="Language">
      <option value="en">English</option>
      <option value="uk">Українська</option>
      <option value="ru">Русский</option>
    </select>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
